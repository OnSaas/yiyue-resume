<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>楚扉月 · 简历</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #1a1612;
      --muted: #6b6258;
      --line: #d8d0c4;
      --accent: #8c2f1b;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "Times New Roman", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e7e0d4; color: var(--ink); }
    body {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .sheet {
      max-width: 820px;
      margin: 32px auto;
      background: var(--paper);
      padding: 48px 52px 56px;
      min-height: calc(100vh - 64px);
      box-shadow: 0 1px 0 rgba(26,22,18,.06), 0 18px 40px rgba(26,22,18,.08);
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px 24px;
      align-items: end;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 18px;
    }

    .name {
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.1;
      margin: 0;
    }
    .name-en {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .tagline {
      margin: 12px 0 0;
      font-size: 16px;
      max-width: 36em;
    }

    .meta {
      text-align: right;
      font-size: 13px;
      color: var(--muted);
    }
    .meta a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .meta a:hover { border-bottom-color: var(--accent); color: var(--accent); }
    .variant {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .actions { margin-top: 10px; }
    .actions button, .actions a.btn {
      appearance: none;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      text-decoration: none;
    }
    .actions button:hover, .actions a.btn:hover { background: var(--ink); color: var(--paper); }

    .body {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(180px, .7fr);
      gap: 36px;
      margin-top: 28px;
    }

    h2 {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin: 0 0 14px;
      color: var(--accent);
    }
    section + section { margin-top: 28px; }

    .job { margin: 0 0 20px; }
    .job-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .job-role { font-weight: 650; }
    .job-org { color: var(--muted); }
    .job-time {
      flex: none;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .job ul { margin: 6px 0 0; padding-left: 1.1em; }
    .job li { margin: 3px 0; }

    .rail p, .rail li { font-size: 13px; }
    .rail ul { margin: 0; padding-left: 1.1em; }
    .contact a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .empty {
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--line);
      padding: 12px 14px;
    }

    footer.note {
      margin-top: 36px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 720px) {
      .sheet { margin: 0; padding: 28px 20px 40px; min-height: 100vh; box-shadow: none; }
      .top, .body, .job-head { grid-template-columns: 1fr; display: block; }
      .meta { text-align: left; margin-top: 12px; }
      .name { font-size: 34px; }
    }

    @media print {
      html, body { background: #fff; }
      .sheet {
        margin: 0; padding: 0; box-shadow: none; min-height: 0;
        background: #fff; max-width: none;
      }
      .actions, footer.note { display: none; }
      a { border-bottom: none !important; }
      @page { margin: 14mm 16mm; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <header class="top">
      <div>
        <h1 class="name" id="name"></h1>
        <p class="name-en" id="nameEn"></p>
        <p class="tagline" id="tagline"></p>
      </div>
      <div class="meta">
        <div class="variant" id="variantLabel"></div>
        <div id="links"></div>
        <div class="actions">
          <button type="button" onclick="window.print()">打印 / PDF</button>
        </div>
      </div>
    </header>

    <div class="body">
      <div>
        <section>
          <h2>经历</h2>
          <div id="experience"></div>
        </section>
        <section>
          <h2>项目</h2>
          <div id="projects"></div>
        </section>
      </div>
      <aside class="rail">
        <section class="contact">
          <h2>联系</h2>
          <div id="contact"></div>
        </section>
        <section>
          <h2>技能</h2>
          <div id="skills"></div>
        </section>
      </aside>
    </div>
    <footer class="note">面向岗位的独立版本，不收录全部履历。改 <code>public/resume.js</code> 即可更新这一版。</footer>
  </article>

  <script src="./resume.js"></script>
  <script>
    const data = window.RESUME || {};
    const $ = (id) => document.getElementById(id);
    const text = (el, v) => { el.textContent = v || ""; el.hidden = !v; };
    const empty = (msg) => `<p class="empty">${msg}</p>`;

    document.title = (data.name || "简历") + (data.tagline ? " · " + data.tagline : " · 简历");
    text($("name"), data.name);
    text($("nameEn"), data.nameEn);
    text($("tagline"), data.tagline);
    text($("variantLabel"), data.variant);

    $("links").innerHTML = (data.links || []).map((l) =>
      `<div><a href="${l.href}">${l.label}</a></div>`
    ).join("");

    $("contact").innerHTML = (data.contact || []).length
      ? (data.contact || []).map((c) =>
          c.href ? `<p><a href="${c.href}">${c.label}</a></p>` : `<p>${c.label}</p>`
        ).join("")
      : empty("未放联系方式");

    $("skills").innerHTML = (data.skills || []).length
      ? `<ul>${data.skills.map((s) => `<li>${s}</li>`).join("")}</ul>`
      : empty("这一版未列技能");

    function renderJobs(list, mount, vacant) {
      if (!list || !list.length) {
        mount.innerHTML = empty(vacant);
        return;
      }
      mount.innerHTML = list.map((j) => `
        <article class="job">
          <div class="job-head">
            <div>
              <span class="job-role">${j.role || ""}</span>
              ${j.org ? `<span class="job-org"> · ${j.org}</span>` : ""}
            </div>
            <div class="job-time">${j.time || ""}</div>
          </div>
          ${j.points && j.points.length ? `<ul>${j.points.map((p) => `<li>${p}</li>`).join("")}</ul>` : ""}
        </article>
      `).join("");
    }

    renderJobs(data.experience, $("experience"), "这一版还没写经历。投递前只填和该岗位相关的条目。");
    renderJobs(data.projects, $("projects"), "这一版还没写项目。");
  </script>
</body>
</html>
