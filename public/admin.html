<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>简历后台</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">简历后台</div>
    <nav class="tabs" aria-label="工作台">
      <button class="tab on" type="button" id="tabResumes">简历</button>
      <button class="tab" type="button" id="tabShares">分享</button>
    </nav>
    <button class="btn ghost" type="button" id="outBtn">退出</button>
  </header>

  <section class="bench" id="benchResumes">
    <div class="toolbar">
      <p class="muted" id="count">0 份</p>
      <div class="row">
        <button class="btn ghost" type="button" id="importBtn">导入 JSON</button>
        <button class="btn" type="button" id="newBtn">新建</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </div>
    <p class="err" id="workErr"></p>
    <div class="cards" id="cards"></div>
  </section>

  <section class="bench hidden" id="benchShares">
    <div class="share-main">
      <div class="tabs" id="shareMode">
        <button class="tab on" type="button" id="modeCreate">生成</button>
        <button class="tab" type="button" id="modeEdit">修改</button>
      </div>
      <p class="muted" id="shareHint">生成会发新 token。修改时 URL 不变。</p>
      <p class="url" id="editToken" hidden></p>
      <div class="share-head">
      <div class="grid">
        <div class="field">
          <label for="resumeId">简历</label>
          <select id="resumeId"></select>
        </div>
        <div class="field">
          <label for="layout">布局</label>
          <select id="layout">
            <option value="inherit">沿用简历设置</option>
            <option value="classic">Classic</option>
            <option value="sidebar">Sidebar</option>
            <option value="two-column">Two Column</option>
            <option value="compact">Compact</option>
          </select>
        </div>
        <div class="field">
          <label for="theme">主题</label>
          <select id="theme"></select>
        </div>
        <div class="field">
          <label for="orientation">页面方向</label>
          <select id="orientation">
            <option value="inherit">沿用简历设置</option>
            <option value="portrait">竖版</option>
            <option value="landscape">横版</option>
          </select>
        </div>
      </div>
      <div class="thumb share-thumb" id="shareThumb">
        <iframe id="sharePreview" title="分享预览" tabindex="-1"></iframe>
      </div>
      </div>
      <div class="grid">
        <div class="field">
          <label for="ttl">有效期</label>
          <select id="ttl">
            <option value="3600">1 小时</option>
            <option value="86400">24 小时</option>
            <option value="604800">7 天</option>
            <option value="2592000">30 天</option>
            <option value="custom">自定义秒</option>
            <option value="never">永不过期</option>
          </select>
        </div>
        <div class="field">
          <label for="ttlCustom">自定义秒</label>
          <input id="ttlCustom" type="number" min="0" placeholder="秒" />
        </div>
        <div class="field">
          <label for="sharePw">密码</label>
          <input id="sharePw" type="password" autocomplete="new-password" />
        </div>
        <div class="field" id="clearPwWrap" hidden>
          <label for="clearPw">去掉密码</label>
          <select id="clearPw">
            <option value="no" selected>否</option>
            <option value="yes">是，变成无密码</option>
          </select>
        </div>
        <div class="field span2">
          <label for="label">备注</label>
          <input id="label" placeholder="给招聘方 A" />
        </div>
      </div>
      <div class="row">
        <button class="btn" type="button" id="shareBtn">生成链接</button>
        <button class="btn ghost" type="button" id="resetShareBtn">清空表单</button>
      </div>
      <p class="url" id="shareOut"></p>
      <p class="err" id="shareErr"></p>
      <h2>已发出</h2>
      <div id="shares"></div>
    </div>
  </section>

  <div class="status" id="status"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
